<!doctype html><html><head><meta charset="utf-8"><title>AgriLink Admin</title><style>body{font:16px system-ui;max-width:1000px;margin:30px auto;padding:0 20px;color:#17352b}input,button{padding:10px;margin:4px;border-radius:6px;border:1px solid #aaa}button{cursor:pointer}.ok{background:#22734b;color:#fff}.danger{background:#b74b43;color:#fff}table{width:100%;border-collapse:collapse;margin-top:20px}td,th{padding:12px;border-bottom:1px solid #ddd;text-align:left}.hide{display:none}</style></head><body><h1>✦ AgriLink Admin</h1><section id="login"><p>Owner login</p><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Admin password"><button class="ok" onclick="loginUser()">Log in</button><p id="msg"></p></section><section id="panel" class="hide"><p>Review farmer, FPO, and buyer registrations.</p><button class="ok" onclick="bulk('approved')">Approve selected</button><button class="danger" onclick="bulk('rejected')">Reject selected</button><button onclick="load()">Refresh</button><table><thead><tr><th><input type="checkbox" onclick="selectAll(this.checked)"></th><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></section><script>const A=location.origin;let token='';async function loginUser(){const r=await fetch(A+'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})}),d=await r.json();if(!r.ok){msg.textContent=d.error;return}token=d.token;document.getElementById('login').classList.add('hide');document.getElementById('panel').classList.remove('hide');load()}async function load(){const r=await fetch(A+'/api/admin/users',{headers:{Authorization:'Bearer '+token}}),u=await r.json();rows.innerHTML=u.map(x=>`<tr><td><input class="pick" value="${x._id}" type="checkbox"></td><td>${x.name}</td><td>${x.email}</td><td>${x.role}</td><td>${x.approvalStatus}</td><td><button onclick="change('${x._id}','approved')">Approve</button><button onclick="change('${x._id}','rejected')">Reject</button></td></tr>`).join('')}function selectAll(v){document.querySelectorAll('.pick').forEach(x=>x.checked=v)}async function change(id,status){await fetch(A+'/api/admin/users/'+id+'/status',{method:'PATCH',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({approvalStatus:status})});load()}async function bulk(status){for(const x of document.querySelectorAll('.pick:checked'))await change(x.value,status);load()}</script></body></html>
