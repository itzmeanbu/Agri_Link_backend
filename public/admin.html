<!doctype html><html><head><meta charset="utf-8"><title>AgriLink Owner Admin</title><style>body{margin:0;min-height:100vh;background:#f4f8f2;font:15px system-ui;color:#17352b}.wrap{max-width:1050px;margin:auto;padding:35px 20px}.login{max-width:390px;margin:12vh auto;background:white;padding:34px;border-radius:14px;box-shadow:0 15px 45px #17352b20;text-align:center}.login img{width:76px;height:76px;object-fit:cover;border-radius:50%}.login h1{margin:12px 0 25px}input,button{width:100%;padding:12px;margin:7px 0;border:1px solid #cbd8cc;border-radius:7px;box-sizing:border-box}button{cursor:pointer;background:#22734b;color:#fff;font-weight:700}.hide{display:none}.bar{display:flex;gap:8px;align-items:center}.bar button{width:auto}table{width:100%;border-collapse:collapse;background:white;margin-top:20px}td,th{padding:12px;border-bottom:1px solid #e1e9e1;text-align:left}.danger{background:#b74b43!important}</style></head><body><div id="login" class="login"><img src="/logo.jpg"><h1>AgriLink Admin</h1><input id="email" type="email" placeholder="Owner email"><input id="password" type="password" placeholder="Owner password"><button onclick="loginUser()">Log in</button><p id="msg"></p></div><main id="app" class="wrap hide"><h1>✦ AgriLink Owner Admin</h1><p>Review and manage farmer, FPO, and buyer accounts.</p><div class="bar"><button onclick="approve('approved')">Approve selected</button><button class="danger" onclick="approve('rejected')">Reject selected</button><button onclick="load()">Refresh</button></div><table><thead><tr><th><input id="all" type="checkbox" onclick="selectAll(this.checked)"></th><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></main><script>const A=location.origin;let token='';async function loginUser(){const r=await fetch(A+'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})}),d=await r.json();if(!r.ok){msg.textContent=d.error;return}token=d.token;login.classList.add('hide');app.classList.remove('hide');load()}async function load(){const r=await fetch(A+'/api/admin/users',{headers:{Authorization:'Bearer '+token}}),u=await r.json();rows.innerHTML=u.map(x=>`<tr><td><input class="pick" type="checkbox" value="${x._id}"></td><td>${x.name}</td><td>${x.email}</td><td>${x.role}</td><td>${x.approvalStatus}</td><td><button onclick="change('${x._id}','approved')">Approve</button><button class="danger" onclick="change('${x._id}','rejected')">Reject</button></td></tr>`).join('')}function selectAll(v){document.querySelectorAll('.pick').forEach(x=>x.checked=v)}async function change(id,status){await fetch(A+'/api/admin/users/'+id+'/status',{method:'PATCH',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({approvalStatus:status})});load()}async function approve(status){for(const x of document.querySelectorAll('.pick:checked'))await change(x.value,status);load()}</script></body></html>
