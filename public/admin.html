<!doctype html><html><head><meta charset="utf-8"><title>AgriLink Admin</title><style>body{font:16px system-ui;max-width:1000px;margin:30px auto;padding:0 20px;color:#17352b}button{padding:9px 14px;margin:4px;border-radius:6px;border:1px solid #aaa;cursor:pointer}.ok{background:#22734b;color:white}.danger{background:#b74b43;color:white}table{width:100%;border-collapse:collapse;margin-top:20px}td,th{padding:12px;border-bottom:1px solid #ddd;text-align:left}.bar{display:flex;gap:8px;align-items:center}</style></head><body><h1>✦ AgriLink Admin</h1><p>Review farmer, FPO, and buyer registrations.</p><div class="bar"><input id="token" placeholder="Admin token" style="flex:1;padding:10px"><button onclick="load()">Load users</button><button class="ok" onclick="bulk('approved')">Approve selected</button><button class="danger" onclick="bulk('rejected')">Reject selected</button></div><table><thead><tr><th><input type="checkbox" id="all" onclick="selectAll(this.checked)"></th><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table><script>const API=location.origin;let users=[];function headers(){return{Authorization:'Bearer '+document.getElementById('token').value}}async function load(){const r=await fetch(API+'/api/admin/users',{headers:headers()});users=await r.json();document.getElementById('rows').innerHTML=users.map(u=>`<tr><td><input class="pick" value="${u._id}" type="checkbox"></td><td>${u.name}</td><td>${u.email}</td><td>${u.role}</td><td>${u.approvalStatus}</td><td><button onclick="change('${u._id}','approved')">Approve</button><button onclick="change('${u._id}','rejected')">Reject</button></td></tr>`).join('')}function selectAll(v){document.querySelectorAll('.pick').forEach(x=>x.checked=v)}async function change(id,status){await fetch(API+'/api/admin/users/'+id+'/status',{method:'PATCH',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify({approvalStatus:status})});load()}async function bulk(status){for(const x of document.querySelectorAll('.pick:checked'))await change(x.value,status);load()}</script></body></html>
